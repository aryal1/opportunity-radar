[project]
name = "opportunity-radar"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "openai>=3.57.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]
