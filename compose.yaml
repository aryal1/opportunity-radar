services:
  app:
    build: .
    ports:
      - "8765:8765"
    environment:
      DATABASE_URL: postgresql+psycopg://radar:${POSTGRES_PASSWORD:-radar-local}@db:5432/opportunity_radar
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opportunity_radar
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar-local}
    volumes:
      - radar-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar -d opportunity_radar"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  radar-postgres:
